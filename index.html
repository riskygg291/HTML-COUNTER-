<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Hero MLBB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f2fe; }
        body { font-family: 'Rajdhani', sans-serif; transition: background-color 0.2s, color 0.2s; }
        .cyber-title { font-family: 'Orbitron', sans-serif; }

        /* Ultra-Cool Loading Screen */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #020617;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .load-bar-container {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }
        .load-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
            animation: fillProgress 2.8s ease-in-out forwards;
        }
        .glitch-text {
            color: var(--accent);
            font-family: 'Orbitron';
            font-size: 1.2rem;
            letter-spacing: 0.5em;
            animation: pulse 1.5s infinite;
        }
        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; filter: brightness(1); }
            50% { opacity: 0.5; filter: brightness(1.5); }
        }
        .hidden-loader { opacity: 0; pointer-events: none; }
        
        /* Neon text pulse effect for Maker Name */
        .neon-maker {
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
            animation: neonPulse 2s infinite alternate;
        }
        @keyframes neonPulse {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.3); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50 min-h-screen pb-12">

    <!-- THE LOADING SYSTEM -->
    <div id="loader">
        <div class="glitch-text uppercase font-black">Counter Hero</div>
        <div class="load-bar-container">
            <div class="load-bar-fill"></div>
        </div>
        <div class="mt-4 text-[10px] text-slate-500 uppercase tracking-[0.4em]">Initializing Global Roster...</div>
    </div>

    <!-- Main Content Area -->
    <div id="mainContent" class="opacity-0 transition-opacity duration-1000">
        <!-- Navigation Header -->
        <header class="sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md px-6 py-4">
            <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h1 class="text-3xl font-black italic tracking-wider cyber-title" style="color: var(--accent);">COUNTER HERO MLBB</h1>
                    <p id="countDisplay" class="text-[10px] tracking-[0.3em] font-bold text-slate-400 dark:text-slate-500 uppercase">SYNCING GLOBAL COMBAT RECORDS...</p>
                </div>
                <div class="flex gap-3 w-full sm:w-auto">
                    <input type="text" id="searchInput" placeholder="Search Hero..." class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500 w-full sm:w-64 text-slate-900 dark:text-white">
                    <button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-white dark:bg-slate-900 p-2.5 rounded-xl border border-slate-300 dark:border-slate-800 text-xl shadow-md">⚙️</button>
                </div>
            </div>
        </header>

        <!-- Main Hero Roster Area -->
        <main class="max-w-7xl mx-auto p-6 mt-4">
            <div id="heroGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5">
                <!-- Global Heroes -->
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-2xl w-full max-w-sm shadow-2xl text-slate-900 dark:text-white relative overflow-hidden">
            
            <!-- Cyber Decor Line -->
            <div class="absolute top-0 left-0 right-0 h-[2px]" style="background: var(--accent);"></div>

            <h2 class="text-xl font-bold mb-1 cyber-title" style="color: var(--accent);">SYSTEM PANEL CONFIG</h2>
            
            <!-- Maker Tag (1000x Cooler Edition) -->
            <div class="mb-6 flex items-center gap-1.5">
                <span class="text-[9px] font-bold tracking-widest text-slate-400 dark:text-slate-500 uppercase">SYSTEM ARCHITECT:</span>
                <span class="text-xs font-black tracking-wider text-slate-900 dark:text-white cyber-title neon-maker bg-slate-100 dark:bg-slate-950 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-800">RISKYBKY</span>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Language Panel</label>
                    <select id="langSelect" onchange="updateUI()" class="w-full mt-2 bg-slate-100 dark:bg-slate-950 p-3 rounded-xl border border-slate-200 dark:border-slate-800 font-bold text-slate-900 dark:text-white">
                        <option value="id">🇮🇩 Indonesian (ID)</option>
                        <option value="en">🇺🇸 English (US)</option>
                    </select>
                </div>
                
                <div>
                    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Visual Theme Matrix</label>
                    <div class="flex gap-2 mt-2">
                        <button onclick="document.documentElement.classList.add('dark')" class="flex-1 p-3 bg-slate-800 text-white rounded-xl text-xs font-bold border border-slate-700">DARK SYSTEM</button>
                        <button onclick="document.documentElement.classList.remove('dark')" class="flex-1 p-3 bg-slate-200 text-slate-900 rounded-xl text-xs font-bold border border-slate-300 shadow-sm">LIGHT SYSTEM</button>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Neon Accent Matrix</label>
                    <div class="flex gap-3 mt-2 justify-between">
                        <button onclick="setRGB('#00f2fe')" class="w-10 h-10 rounded-xl bg-[#00f2fe] border-2 border-white/40 shadow-md"></button>
                        <button onclick="setRGB('#ff006e')" class="w-10 h-10 rounded-xl bg-[#ff006e] border-2 border-white/40 shadow-md"></button>
                        <button onclick="setRGB('#70e000')" class="w-10 h-10 rounded-xl bg-[#70e000] border-2 border-white/40 shadow-md"></button>
                        <button onclick="setRGB('#fee440')" class="w-10 h-10 rounded-xl bg-[#fee440] border-2 border-white/40 shadow-md"></button>
                    </div>
                </div>
            </div>
            
            <button onclick="document.getElementById('modal').classList.add('hidden')" class="w-full mt-8 py-3.5 bg-slate-900 dark:bg-slate-950 text-white rounded-xl font-bold tracking-widest text-xs border border-slate-700 hover:opacity-90">SAVE PARAMETERS</button>
        </div>
    </div>

    <script>
        // BOOT SEQUENCE HANDLER
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden-loader');
                document.getElementById('mainContent').classList.remove('opacity-0');
            }, 3000); // 3-second lock-on
        });

        const MASTER_ROSTER = [

            { name: "Alice", key: "alice" }, { name: "Nana", key: "nana" }, { name: "Tigreal", key: "tigreal" },
            { name: "Alucard", key: "alucard" }, { name: "Karina", key: "karina" }, { name: "Akai", key: "akai" },
            { name: "Franco", key: "franco" }, { name: "Bruno", key: "bruno" }, { name: "Clint", key: "clint" },
            { name: "Rafaela", key: "rafaela" }, { name: "Eudora", key: "eudora" }, { name: "Zilong", key: "zilong" },
            { name: "Fanny", key: "fanny" }, { name: "Layla", key: "layla" }, { name: "Minotaur", key: "minotaur" },
            { name: "Lolita", key: "lolita" }, { name: "Hayabusa", key: "hayabusa" }, { name: "Freya", key: "freya" },
            { name: "Gord", key: "gord" }, { name: "Natalia", key: "natalia" }, { name: "Kagura", key: "kagura" },
            { name: "Chou", key: "chou" }, { name: "Sun", key: "sun" }, { name: "Alpha", key: "alpha" },

            { name: "Johnson", key: "johnson" }, { name: "Cyclops", key: "cyclops" }, { name: "Estes", key: "estes" },
            { name: "Hilda", key: "hilda" }, { name: "Aurora", key: "aurora" }, { name: "Lapu-Lapu", key: "lapulapu" },
            { name: "Vexana", key: "vexana" }, { name: "Roger", key: "roger" }, { name: "Karrie", key: "karrie" },
            { name: "Gatotkaca", key: "gatotkaca" }, { name: "Harley", key: "harley" }, { name: "Irithel", key: "irithel" },
            { name: "Grock", key: "grock" }, { name: "Argus", key: "argus" }, { name: "Odette", key: "odette" },
            { name: "Lancelot", key: "lancelot" }, { name: "Diggie", key: "diggie" }, { name: "Hylos", key: "hylos" },
            { name: "Zhask", key: "zhask" }, { name: "Helcurt", key: "helcurt" }, { name: "Pharsa", key: "pharsa" },
            { name: "Lesley", key: "lesley" }, { name: "Jawhead", key: "jawhead" }, { name: "Angela", key: "angela" },
            { name: "Gusion", key: "gusion" }, { name: "Valir", key: "valir" }, { name: "Martis", key: "martis" },
            { name: "Uranus", key: "uranus" }, { name: "Hanabi", key: "hanabi" }, { name: "Chang'e", key: "change" },
            { name: "Selena", key: "selena" }, { name: "Aldous", key: "aldous" }, { name: "Claude", key: "claude" },
            { name: "Vale", key: "vale" }, { name: "Leomord", key: "leomord" }, { name: "Lunox", key: "lunox" },
            { name: "Hanzo", key: "hanzo" }, { name: "Belerick", key: "belerick" }, { name: "Kimmy", key: "kimmy" },
            { name: "Thamuz", key: "thamuz" }, { name: "Harith", key: "harith" }, { name: "Minsitthar", key: "minsitthar" },
            { name: "Kadita", key: "kadita" }, { name: "Badang", key: "badang" }, { name: "Khufra", key: "khufra" },
            { name: "Esmeralda", key: "esmeralda" }, { name: "Granger", key: "granger" }, { name: "Guinevere", key: "guinevere" },
            { name: "Terizla", key: "terizla" }, { name: "X.Borg", key: "xborg" }, { name: "Ling", key: "ling" },
            { name: "Dyrroth", key: "dyrroth" }, { name: "Lylia", key: "lylia" }, { name: "Baxia", key: "baxia" },
            { name: "Masha", key: "masha" }, { name: "Wanwan", key: "wanwan" }, { name: "Silvanna", key: "silvanna" },
            { name: "Cecilion", key: "cecilion" }, { name: "Carmilla", key: "carmilla" }, { name: "Atlas", key: "atlas" },
            { name: "Popol and Kupa", key: "popolandkupa" }, { name: "Yu Zhong", key: "yuzhong" }, { name: "Khaleed", key: "khaleed" },
            { name: "Barats", key: "barats" }, { name: "Brody", key: "brody" }, { name: "Benedetta", key: "benedetta" },
            { name: "Mathilda", key: "mathilda" }, { name: "Paquito", key: "paquito" }, { name: "Yve", key: "yve" },
            { name: "Beatrix", key: "beatrix" }, { name: "Phoveus", key: "phoveus" }, { name: "Gloo", key: "gloo" },
            { name: "Natan", key: "natan" }, { name: "Aulus", key: "aulus" }, { name: "Floryn", key: "floryn" },
            { name: "Valentina", key: "valentina" }, { name: "Edith", key: "edith" }, { name: "Yin", key: "yin" },
            { name: "Melissa", key: "melissa" }, { name: "Xavier", key: "xavier" }, { name: "Julian", key: "julian" },
            { name: "Fredrinn", key: "fredrinn" }, { name: "Joy", key: "joy" }, { name: "Novaria", key: "novaria" },
            { name: "Ixia", key: "ixia" }, { name: "Nolan", key: "nolan" }, { name: "Cici", key: "cici" },
            { name: "Arlott", key: "arlott" }, { name: "Suyou", key: "suyou" }, { name: "Lukas", key: "lukas" },
            { name: "Zhuxin", key: "zhuxin" }, { name: "Chip", key: "chip" }
        ];

        const counterPool = [
            { c: "Baxia, Sea Halberd, Dominance Ice", id: "Gunakan efek Anti-Heal untuk mematikan HP regen dan lifesteal.", en: "Deploy active Anti-Heal kits to completely break health regeneration metrics." },
            { c: "Chou, Kaja, Franco (Suppress)", id: "Gunakan burst instan atau efek cc suppress sebelum mereka bergerak.", en: "Chain quick instant pick bursts or suppress crowd control down before mobilization." },
            { c: "Radiant Armor, Athena's Shield", id: "Gunakan item Magic Defense berlapis untuk meredam damage burst berkala.", en: "Stack defensive magical barriers to absorb deep continuous spell pierce hits." },
            { c: "Khufra, Minsitthar, Phoveus", id: "Gunakan mekanik anti-dash untuk mengunci pergerakan lincah hero ini.", en: "Utilize anti-dash zone containment systems to lock down escape vectors completely." }
        ];

        const HERO_DATA = MASTER_ROSTER.map((h, i) => {
            const strategy = counterPool[i % counterPool.length];
            return {
                name: h.name,
                img: `https://m.mobilelegends.com/static/images/herolist/avatar/square/${h.key}.jpg`,
                counters: strategy.c,
                id_desc: strategy.id,
                en_desc: strategy.en
            };
        });

        function setRGB(c) { 
            document.documentElement.style.setProperty('--accent', c); 
            updateUI();
        }

        function updateUI() {
            const grid = document.getElementById('heroGrid');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const lang = document.getElementById('langSelect').value;
            grid.innerHTML = '';

            const filtered = HERO_DATA.filter(h => h.name.toLowerCase().includes(search));
            document.getElementById('countDisplay').textContent = `${filtered.length} GLOBAL HEROES INDEXED`;

            filtered.forEach(hero => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden flex flex-col h-full shadow-sm hover:shadow-xl hover:scale-[1.02] transition-all duration-200";
                
                const label = lang === 'id' ? "COUNTER STRATEGI:" : "TACTICAL COUNTER:";
                const currentDesc = lang === 'id' ? hero.id_desc : hero.en_desc;

                card.innerHTML = `
                    <div class="relative w-full aspect-square bg-slate-200 dark:bg-slate-950">
                        <img src="${hero.img}" alt="${hero.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400/0f172a/ffffff?text=${hero.name}'">
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <h3 class="font-black text-lg tracking-wide uppercase truncate text-slate-900 dark:text-white">${hero.name}</h3>
                            <div class="mt-3 bg-red-50 dark:bg-slate-950/90 p-2.5 rounded-lg border border-red-200 dark:border-red-500/20">
                                <span class="text-[9px] text-red-500 dark:text-red-400 font-black tracking-wider block">${label}</span>
                                <span class="text-xs font-bold text-slate-800 dark:text-slate-100 mt-0.5 block leading-tight">${hero.counters}</span>
                            </div>
                        </div>
                        <p class="mt-3 text-[11px] text-slate-500 dark:text-slate-400 italic font-semibold leading-normal border-t border-slate-100 dark:border-white/5 pt-2">
                            ${currentDesc}
                        </p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        document.getElementById('searchInput').addEventListener('input', updateUI);
        updateUI();
    </script>
</body>
    </html>
